# Family: w4a4_mechanism
#
# NOT A CONFIGURATION NVIDIA SHIPS. Label it as such in every table, plot and
# caption that reports it.
#
# Identical to w4a16_shipped - which is transcribed from the shipped
# checkpoint's own hf_quant_config.json - except that routed experts
# additionally carry per-tensor NVFP4 activation quantization (W4A4). That
# single change is what makes spec section 0's stated mechanism testable:
#
#   "Calibration computes per-tensor static scales via absolute amax
#    aggregated over the calibration set. With top-k routing over many
#    experts, each expert sees only a fraction of calibration tokens. If
#    Malay routes differently from the calibration corpus's languages, the
#    experts Malay depends on receive sparse coverage and unreliable amax
#    estimates."
#
# Under W4A16 there are no expert activation scales, so that chain cannot
# operate. Under W4A4 it can. With 128 routed experts and top-k 6, each token
# reaches 6/128 of them, so coverage is genuinely sparse.
#
# Running both families separates "calibration language matters for FP4 MoE in
# principle" from "calibration language matters for the checkpoint you can
# download today". See SPEC_DEVIATIONS.md D2.

name: w4a4_mechanism
upstream: w4a16_nvfp4_4o6.yaml
upstream_repo: https://github.com/NVIDIA/Model-Optimizer
transcribed_from: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4/hf_quant_config.json
verified_on: 2026-08-18
shipped_by_nvidia: false
description: >-
  Research configuration. W4A4 on routed experts so that per-tensor activation
  amax estimation genuinely occurs and can be starved by sparse routing
  coverage. Every other assignment matches the shipped recipe.

architecture:
  model_type: nemotron_h
  n_routed_experts: 128
  num_experts_per_tok: 6
  n_moe_layers: 23

quantization:
  algorithm: max                    # amax calibration - the mechanism under test
  default_precision: bfloat16
  quant_algo: MIXED_PRECISION

  layers:
    # Routed experts - W4A4. Activation scales are estimated per tensor by
    # absolute amax over the calibration set, which is the quantity sparse
    # routing coverage is hypothesised to damage.
    - pattern: "*.mixer.experts.*.up_proj"
      format: nvfp4
      quant_algo: W4A4_NVFP4
      weight_bits: 4
      activation_bits: 4
      group_size: 16
      scale_format: fp8_e4m3
      global_scale: fp32
      activation_scale_mode: static
      activation_granularity: per_tensor
      activation_calibrator: max
    - pattern: "*.mixer.experts.*.down_proj"
      format: nvfp4
      quant_algo: W4A4_NVFP4
      weight_bits: 4
      activation_bits: 4
      group_size: 16
      scale_format: fp8_e4m3
      global_scale: fp32
      activation_scale_mode: static
      activation_granularity: per_tensor
      activation_calibrator: max

    # Shared experts stay W4A16, matching the shipped recipe. They see every
    # token regardless of routing, so they are not subject to the coverage
    # mechanism and changing them would add a confound.
    - pattern: "*.mixer.shared_experts.up_proj"
      format: nvfp4
      quant_algo: W4A16_NVFP4
      weight_bits: 4
      activation_bits: 16
      group_size: 16
    - pattern: "*.mixer.shared_experts.down_proj"
      format: nvfp4
      quant_algo: W4A16_NVFP4
      weight_bits: 4
      activation_bits: 16
      group_size: 16

    - pattern: "*.mixer.in_proj"
      format: fp8
      quant_algo: FP8
      scale_format: e4m3
      scale_mode: dynamic
      granularity: per_tensor
    - pattern: "*.mixer.out_proj"
      format: fp8
      quant_algo: FP8
      scale_format: e4m3
      scale_mode: dynamic
      granularity: per_tensor

    - pattern: "lm_head"
      format: nvfp4
      quant_algo: W4A16_NVFP4
      weight_bits: 4
      activation_bits: 16
      group_size: 16

  exclude:
    - "*.mixer.q_proj"
    - "*.mixer.k_proj"
    - "*.mixer.v_proj"
    - "*.mixer.o_proj"
    - "*.mixer.conv1d"
    - "*.mixer.gate"
    - "backbone.embeddings"
    - "mtp*"

  kv_cache:
    format: fp8
    quant_algo: FP8
    scale_format: e4m3

  mamba_ssm_state:
    dtype: runtime_configurable

calibration:
  dataset_path: null
  num_samples: null
  seq_len: 32768
  batch_size: 1
